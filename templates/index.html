<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AT-D578UV Repeater Web Portal</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 2px solid #0f3460;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 1.8rem;
            color: #e94560;
            margin-bottom: 5px;
        }

        header p {
            color: #aaa;
            font-size: 0.9rem;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f3460;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-light {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #666;
            box-shadow: 0 0 5px #666;
            transition: all 0.3s ease;
        }

        .status-light.connected {
            background: #00c800;
            box-shadow: 0 0 10px #00c800;
        }

        .status-light.ptt-active {
            background: #ff0023;
            box-shadow: 0 0 15px #ff0023;
            animation: pulse 0.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .callsign {
            font-size: 1.5rem;
            font-weight: bold;
            color: #e94560;
            letter-spacing: 2px;
        }

        .control-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .control-buttons button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-connect {
            background: #00c800;
            color: #000;
        }

        .btn-connect:hover {
            background: #00e000;
        }

        .btn-disconnect {
            background: #ff4444;
            color: #fff;
        }

        .btn-disconnect:hover {
            background: #ff6666;
        }

        .btn-settings {
            background: #0f3460;
            color: #fff;
            border: 1px solid #e94560 !important;
        }

        .btn-settings:hover {
            background: #e94560;
        }

        .mic-panel {
            background: #262626;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .ptt-section {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .ptt-button {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(145deg, #3a3a3a, #1a1a1a);
            border: 4px solid #444;
            color: #fff;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ptt-button:active,
        .ptt-button.active {
            background: linear-gradient(145deg, #ff0023, #cc001c);
            border-color: #ff0023;
            transform: scale(0.95);
            box-shadow: 0 0 30px rgba(255, 0, 35, 0.5);
        }

        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .nav-btn {
            width: 60px;
            height: 40px;
            background: #333;
            border: 2px solid #555;
            border-radius: 8px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            background: #444;
            border-color: #e94560;
        }

        .nav-btn:active {
            transform: scale(0.95);
            background: #e94560;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            max-width: 300px;
            margin: 0 auto 25px;
        }

        .key-btn {
            aspect-ratio: 1;
            background: #333;
            border: 2px solid #444;
            border-radius: 12px;
            color: #fff;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .key-btn span {
            font-size: 0.6rem;
            color: #888;
            margin-top: 2px;
        }

        .key-btn:hover {
            background: #444;
            border-color: #e94560;
        }

        .key-btn:active {
            transform: scale(0.95);
            background: #e94560;
        }

        .function-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .func-btn {
            width: 60px;
            height: 60px;
            background: linear-gradient(145deg, #4a4a4a, #2a2a2a);
            border: 2px solid #555;
            border-radius: 50%;
            color: #fff;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .func-btn:hover {
            background: linear-gradient(145deg, #5a5a5a, #3a3a3a);
            border-color: #e94560;
        }

        .func-btn:active {
            transform: scale(0.95);
            background: #e94560;
        }

        .sub-ab-btn {
            width: 50px;
            height: 100px;
            background: #333;
            border: 2px solid #555;
            border-radius: 8px;
            color: #fff;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
            writing-mode: vertical-rl;
            text-orientation: mixed;
        }

        .sub-ab-btn:hover {
            background: #444;
            border-color: #e94560;
        }

        .sub-ab-btn:active {
            transform: scale(0.95);
            background: #e94560;
        }

        /* Settings Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1a1a2e;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: #e94560;
        }

        .modal-close {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #aaa;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            background: #0f3460;
            border: 1px solid #444;
            border-radius: 5px;
            color: #fff;
            font-size: 1rem;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #e94560;
        }

        .btn-save {
            width: 100%;
            padding: 12px;
            background: #e94560;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-save:hover {
            background: #ff6b8a;
        }

        .log-panel {
            background: #0f3460;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            max-height: 150px;
            overflow-y: auto;
        }

        .log-panel h3 {
            color: #e94560;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .log-entry {
            font-family: monospace;
            font-size: 0.8rem;
            color: #aaa;
            padding: 3px 0;
            border-bottom: 1px solid #1a1a2e;
        }

        .log-entry.success {
            color: #00c800;
        }

        .log-entry.error {
            color: #ff4444;
        }

        @media (max-width: 600px) {
            .container {
                padding: 10px;
            }

            .mic-panel {
                padding: 20px;
            }

            .ptt-button {
                width: 100px;
                height: 100px;
                font-size: 1.2rem;
            }

            .keypad {
                gap: 10px;
            }

            .key-btn {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>AT-D578UV Repeater Web Portal</h1>
            <p>Software Microphone Control Interface</p>
        </header>

        <div class="status-bar">
            <div class="status-indicator">
                <div class="status-light" id="statusLight"></div>
                <span id="statusText">Disconnected</span>
            </div>
            <div class="callsign" id="callsign">{{ callsign }}</div>
        </div>

        <div class="control-buttons">
            <button class="btn-connect" id="btnConnect" onclick="connect()">Connect</button>
            <button class="btn-disconnect" id="btnDisconnect" onclick="disconnect()">Disconnect</button>
            <button class="btn-settings" onclick="openSettings()">Settings</button>
        </div>

        <div class="mic-panel">
            <div class="ptt-section">
                <button class="ptt-button" id="pttButton"
                    onmousedown="pttPress()" onmouseup="pttRelease()"
                    ontouchstart="pttPress()" ontouchend="pttRelease()">
                    PTT
                </button>
            </div>

            <div class="nav-buttons">
                <button class="nav-btn" onclick="sendButton('down')">DN</button>
                <button class="sub-ab-btn" onclick="sendButton('subab')">SUB<br>A/B</button>
                <button class="nav-btn" onclick="sendButton('up')">UP</button>
            </div>

            <div class="keypad">
                <button class="key-btn" onclick="sendButton('1')">1<span>! &lt;</span></button>
                <button class="key-btn" onclick="sendButton('2')">2<span>ABC</span></button>
                <button class="key-btn" onclick="sendButton('3')">3<span>DEF</span></button>
                <button class="key-btn" onclick="sendButton('4')">4<span>GHI</span></button>
                <button class="key-btn" onclick="sendButton('5')">5<span>JKL</span></button>
                <button class="key-btn" onclick="sendButton('6')">6<span>MNO</span></button>
                <button class="key-btn" onclick="sendButton('7')">7<span>PQRS</span></button>
                <button class="key-btn" onclick="sendButton('8')">8<span>TUV</span></button>
                <button class="key-btn" onclick="sendButton('9')">9<span>WXYZ</span></button>
                <button class="key-btn" onclick="sendButton('star')">*<span>Lock</span></button>
                <button class="key-btn" onclick="sendButton('0')">0<span>+</span></button>
                <button class="key-btn" onclick="sendButton('hash')">#<span>Shift</span></button>
            </div>

            <div class="function-buttons">
                <button class="func-btn" onclick="sendButton('a')" ondblclick="sendButton('a_long')">A</button>
                <button class="func-btn" onclick="sendButton('b')" ondblclick="sendButton('b_long')">B</button>
                <button class="func-btn" onclick="sendButton('c')" ondblclick="sendButton('c_long')">C</button>
                <button class="func-btn" onclick="sendButton('d')" ondblclick="sendButton('d_long')">D</button>
            </div>
        </div>

        <div class="log-panel">
            <h3>Activity Log</h3>
            <div id="logEntries"></div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Settings</h2>
                <button class="modal-close" onclick="closeSettings()">&times;</button>
            </div>
            <form id="settingsForm" onsubmit="saveSettings(event)">
                <div class="form-group">
                    <label>Callsign</label>
                    <input type="text" id="settingCallsign" maxlength="6" placeholder="NOCALL">
                </div>
                <div class="form-group">
                    <label>Serial Port</label>
                    <select id="settingPort">
                        <option value="">Select port...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Baud Rate</label>
                    <select id="settingBaudrate">
                        <option value="9600">9600</option>
                        <option value="19200">19200</option>
                        <option value="38400">38400</option>
                        <option value="57600">57600</option>
                        <option value="115200" selected>115200</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Data Bits</label>
                    <select id="settingBytesize">
                        <option value="SEVENBITS">7 bits</option>
                        <option value="EIGHTBITS" selected>8 bits</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Parity</label>
                    <select id="settingParity">
                        <option value="PARITY_NONE" selected>None</option>
                        <option value="PARITY_EVEN">Even</option>
                        <option value="PARITY_ODD">Odd</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Stop Bits</label>
                    <select id="settingStopbits">
                        <option value="STOPBITS_ONE" selected>1</option>
                        <option value="STOPBITS_ONE_POINT_FIVE">1.5</option>
                        <option value="STOPBITS_TWO">2</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Timeout (seconds)</label>
                    <input type="number" id="settingTimeout" value="1" min="1" max="10">
                </div>
                <div class="form-group">
                    <label>Poll Interval (seconds)</label>
                    <input type="number" id="settingPollinterval" value="1" min="1" max="5">
                </div>
                <button type="submit" class="btn-save">Save Settings</button>
            </form>
        </div>
    </div>

    <script>
        // WebSocket connection
        const socket = io();
        let isConnected = false;
        let pttActive = false;

        // Status updates
        socket.on('status_update', (data) => {
            isConnected = data.connected;
            pttActive = data.ptt_active;
            updateUI();
        });

        socket.on('button_response', (data) => {
            addLog(data.success ? 'success' : 'error',
                   `Button ${data.button}: ${data.message}`);
        });

        socket.on('ptt_response', (data) => {
            pttActive = data.active;
            updateUI();
            addLog(data.success ? 'success' : 'error',
                   `PTT ${data.active ? 'ACTIVE' : 'Released'}: ${data.message}`);
        });

        function updateUI() {
            const statusLight = document.getElementById('statusLight');
            const statusText = document.getElementById('statusText');
            const pttButton = document.getElementById('pttButton');

            statusLight.classList.toggle('connected', isConnected);
            statusLight.classList.toggle('ptt-active', pttActive);
            statusText.textContent = isConnected ?
                (pttActive ? 'TRANSMITTING' : 'Connected') : 'Disconnected';

            pttButton.classList.toggle('active', pttActive);
        }

        function connect() {
            fetch('/api/connect', { method: 'POST' })
                .then(r => r.json())
                .then(data => {
                    addLog(data.success ? 'success' : 'error', data.message);
                });
        }

        function disconnect() {
            fetch('/api/disconnect', { method: 'POST' })
                .then(r => r.json())
                .then(data => {
                    addLog(data.success ? 'success' : 'error', data.message);
                });
        }

        function sendButton(button) {
            socket.emit('button_press', { button: button, action: 'click' });
        }

        function pttPress() {
            socket.emit('ptt_press');
        }

        function pttRelease() {
            socket.emit('ptt_release');
        }

        function addLog(type, message) {
            const logEntries = document.getElementById('logEntries');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            const time = new Date().toLocaleTimeString();
            entry.textContent = `[${time}] ${message}`;
            logEntries.insertBefore(entry, logEntries.firstChild);

            // Keep only last 50 entries
            while (logEntries.children.length > 50) {
                logEntries.removeChild(logEntries.lastChild);
            }
        }

        function openSettings() {
            document.getElementById('settingsModal').classList.add('active');
            loadSettings();
            loadPorts();
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.remove('active');
        }

        function loadSettings() {
            fetch('/api/config')
                .then(r => r.json())
                .then(data => {
                    document.getElementById('settingCallsign').value = data.callsign;
                    document.getElementById('settingPort').value = data.port;
                    document.getElementById('settingBaudrate').value = data.baudrate;
                    document.getElementById('settingBytesize').value = data.bytesize;
                    document.getElementById('settingParity').value = data.parity;
                    document.getElementById('settingStopbits').value = data.stopbits;
                    document.getElementById('settingTimeout').value = data.timeout;
                    document.getElementById('settingPollinterval').value = data.pollinterval;
                });
        }

        function loadPorts() {
            fetch('/api/ports')
                .then(r => r.json())
                .then(data => {
                    const select = document.getElementById('settingPort');
                    const currentValue = select.value;

                    // Clear existing options except first
                    while (select.options.length > 1) {
                        select.remove(1);
                    }

                    data.ports.forEach(port => {
                        const option = document.createElement('option');
                        option.value = port;
                        option.textContent = port;
                        select.appendChild(option);
                    });

                    // Restore selection
                    if (currentValue) {
                        select.value = currentValue;
                    }
                });
        }

        function saveSettings(event) {
            event.preventDefault();

            const settings = {
                callsign: document.getElementById('settingCallsign').value,
                port: document.getElementById('settingPort').value,
                baudrate: document.getElementById('settingBaudrate').value,
                bytesize: document.getElementById('settingBytesize').value,
                parity: document.getElementById('settingParity').value,
                stopbits: document.getElementById('settingStopbits').value,
                timeout: document.getElementById('settingTimeout').value,
                pollinterval: document.getElementById('settingPollinterval').value
            };

            fetch('/api/config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(settings)
            })
            .then(r => r.json())
            .then(data => {
                addLog(data.success ? 'success' : 'error', data.message);
                if (data.success) {
                    closeSettings();
                    document.getElementById('callsign').textContent = settings.callsign;
                }
            });
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;

            switch(e.key) {
                case ' ':
                    e.preventDefault();
                    if (!pttActive) pttPress();
                    break;
                case '0': case '1': case '2': case '3': case '4':
                case '5': case '6': case '7': case '8': case '9':
                    sendButton(e.key);
                    break;
                case '*':
                    sendButton('star');
                    break;
                case '#':
                    sendButton('hash');
                    break;
                case 'ArrowUp':
                    e.preventDefault();
                    sendButton('up');
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    sendButton('down');
                    break;
                case 'a': case 'A':
                    sendButton('a');
                    break;
                case 'b': case 'B':
                    sendButton('b');
                    break;
                case 'c': case 'C':
                    sendButton('c');
                    break;
                case 'd': case 'D':
                    sendButton('d');
                    break;
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === ' ' && pttActive) {
                pttRelease();
            }
        });

        // Initial status check
        fetch('/api/status')
            .then(r => r.json())
            .then(data => {
                isConnected = data.connected;
                pttActive = data.ptt_active;
                updateUI();
            });

        addLog('success', 'Web Portal initialized');
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Scanner - AT-D578UV</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Share+Tech+Mono&family=Overpass:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        /*
         * UNSC-Inspired Scanner UI
         * Based on Halo/Military Tactical Theme
         */

        :root {
            --unsc-blue: #a8d4ff;
            --covenant-purple: #7b2cbf;
            --warning-orange: #ff6d00;
            --shield-blue: #c8e4ff;
            --electric-blue: #7ab8ff;
            --background-dark: #0a0e17;
            --background-medium: #151b2b;
            --background-light: #1f2937;
            --text-primary: #e8f4f8;
            --text-secondary: #8b95a8;
            --grid-color: rgba(168, 212, 255, 0.1);
            --border-color: rgba(168, 212, 255, 0.3);
            --primary-color: #00d9ff;
            --card-bg: #151b2b;
            --text-muted: #6b7280;
            --accent-green: #00ff41;
            --accent-red: #ff3333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Overpass', sans-serif;
            background: var(--background-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
            opacity: 0.3;
            pointer-events: none;
        }

        /* Scanner Display - Top Section */
        .scanner-display {
            background: linear-gradient(180deg, rgba(10, 14, 23, 0.98) 0%, rgba(21, 27, 43, 0.95) 100%);
            border-bottom: 3px solid var(--primary-color);
            padding: 25px;
            position: relative;
            z-index: 1;
            box-shadow: 0 0 30px rgba(0, 217, 255, 0.2);
        }

        .display-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .scanner-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .license-badge {
            font-family: 'Share Tech Mono', monospace;
            background: var(--warning-orange);
            color: #000;
            padding: 5px 12px;
            border-radius: 3px;
            font-size: 0.8rem;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(255, 109, 0, 0.5);
        }

        .frequency-display {
            text-align: center;
            padding: 25px 0;
        }

        .frequency-value {
            font-family: 'Share Tech Mono', monospace;
            font-size: 4rem;
            font-weight: bold;
            color: var(--primary-color);
            text-shadow: 0 0 40px rgba(0, 217, 255, 0.6), 0 0 80px rgba(0, 217, 255, 0.3);
            letter-spacing: 4px;
        }

        .freq-input {
            font-family: 'Share Tech Mono', monospace;
            font-size: 4rem;
            font-weight: bold;
            color: var(--primary-color);
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid var(--primary-color);
            border-radius: 8px;
            text-align: center;
            width: 400px;
            padding: 10px;
            text-shadow: 0 0 40px rgba(0, 217, 255, 0.6);
            box-shadow: 0 0 30px rgba(0, 217, 255, 0.3);
        }

        .freq-input:focus {
            outline: none;
            box-shadow: 0 0 50px rgba(0, 217, 255, 0.5);
        }

        .frequency-unit {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            color: var(--primary-color);
            opacity: 0.7;
            margin-left: 10px;
        }

        .channel-info {
            text-align: center;
            margin-top: 10px;
        }

        .channel-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            color: var(--unsc-blue);
            font-weight: 600;
            text-shadow: 0 0 15px rgba(168, 212, 255, 0.5);
        }

        .channel-mode {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 5px;
        }

        .channel-mode .encrypted {
            color: var(--warning-orange);
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 109, 0, 0.5);
        }

        /* Signal Meter */
        .signal-meter-container {
            max-width: 650px;
            margin: 25px auto 0;
        }

        .signal-meter {
            display: flex;
            gap: 3px;
            height: 35px;
            background: rgba(10, 14, 23, 0.8);
            padding: 6px;
            border-radius: 5px;
            border: 1px solid var(--border-color);
        }

        .signal-bar {
            flex: 1;
            background: rgba(168, 212, 255, 0.1);
            border-radius: 2px;
            transition: all 0.1s ease;
        }

        .signal-bar.active.low {
            background: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
        }
        .signal-bar.active.mid {
            background: var(--warning-orange);
            box-shadow: 0 0 8px var(--warning-orange);
        }
        .signal-bar.active.high {
            background: var(--accent-red);
            box-shadow: 0 0 8px var(--accent-red);
        }

        .signal-labels {
            display: flex;
            justify-content: space-between;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 5px;
            padding: 0 5px;
        }

        /* Status LEDs */
        .status-leds {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 25px;
        }

        .status-led {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .led {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: rgba(100, 100, 100, 0.3);
            border: 2px solid rgba(100, 100, 100, 0.5);
            transition: all 0.3s ease;
        }

        .led.on {
            background: var(--accent-green);
            border-color: var(--accent-green);
            box-shadow: 0 0 15px var(--accent-green), 0 0 30px var(--accent-green);
        }

        .led.recording {
            background: var(--accent-red);
            border-color: var(--accent-red);
            box-shadow: 0 0 15px var(--accent-red), 0 0 30px var(--accent-red);
            animation: blink 1s infinite;
        }

        .led.streaming {
            background: var(--primary-color);
            border-color: var(--primary-color);
            box-shadow: 0 0 15px var(--primary-color), 0 0 30px var(--primary-color);
        }

        @keyframes blink {
            50% { opacity: 0.3; }
        }

        .led-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Main Layout */
        .main-container {
            display: grid;
            grid-template-columns: 300px 1fr 340px;
            gap: 0;
            min-height: calc(100vh - 280px);
            position: relative;
            z-index: 1;
        }

        @media (max-width: 1200px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        /* Channel List Panel */
        .channel-panel {
            background: var(--background-medium);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            padding: 18px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 217, 255, 0.03);
        }

        .panel-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--unsc-blue);
        }

        #channelCount {
            font-family: 'Share Tech Mono', monospace;
            color: var(--primary-color);
            font-size: 0.9rem;
        }

        .channel-filters {
            display: flex;
            gap: 6px;
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            background: rgba(0, 0, 0, 0.2);
        }

        .filter-btn {
            font-family: 'Orbitron', sans-serif;
            padding: 6px 12px;
            font-size: 0.7rem;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .filter-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }
        .filter-btn.active {
            background: var(--primary-color);
            color: #000;
            border-color: var(--primary-color);
            font-weight: 600;
        }

        .channel-list {
            flex: 1;
            overflow-y: auto;
        }

        .channel-item {
            padding: 14px 18px;
            border-bottom: 1px solid rgba(168, 212, 255, 0.1);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .channel-item:hover {
            background: rgba(168, 212, 255, 0.05);
            border-left: 3px solid var(--unsc-blue);
            padding-left: 15px;
        }

        .channel-item.active {
            background: rgba(0, 217, 255, 0.1);
            border-left: 4px solid var(--primary-color);
            box-shadow: inset 0 0 20px rgba(0, 217, 255, 0.1);
        }

        .channel-item.has-signal {
            background: rgba(0, 255, 65, 0.1);
            border-left: 4px solid var(--accent-green);
        }

        .ch-info {
            flex: 1;
        }

        .ch-name {
            font-family: 'Orbitron', sans-serif;
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--text-primary);
        }

        .ch-freq {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 3px;
        }

        .ch-badges {
            display: flex;
            gap: 5px;
        }

        .ch-badge {
            font-family: 'Orbitron', sans-serif;
            padding: 3px 8px;
            font-size: 0.65rem;
            border-radius: 2px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .ch-badge.enc {
            background: rgba(255, 109, 0, 0.3);
            color: var(--warning-orange);
            border: 1px solid var(--warning-orange);
        }
        .ch-badge.dmr {
            background: rgba(0, 217, 255, 0.2);
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
        }
        .ch-badge.rx {
            background: rgba(100, 100, 100, 0.3);
            color: #aaa;
            border: 1px solid #666;
        }

        /* Control Panel */
        .control-panel {
            background: var(--background-medium);
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .control-group {
            background: rgba(10, 14, 23, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 18px;
        }

        .control-group-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            color: var(--unsc-blue);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .control-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .ctrl-btn {
            font-family: 'Orbitron', sans-serif;
            padding: 16px;
            border: 2px solid var(--border-color);
            background: transparent;
            color: var(--text-primary);
            font-size: 0.85rem;
            font-weight: 500;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .ctrl-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
            box-shadow: 0 0 15px rgba(0, 217, 255, 0.2);
        }

        .ctrl-btn.active {
            background: var(--primary-color);
            color: #000;
            border-color: var(--primary-color);
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.4);
        }

        .ctrl-btn.record { border-color: var(--accent-red); }
        .ctrl-btn.record:hover {
            color: var(--accent-red);
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.3);
        }
        .ctrl-btn.record.active {
            background: var(--accent-red);
            color: #fff;
            animation: blink 1s infinite;
        }

        /* Volume/Squelch Controls */
        .slider-control {
            margin-bottom: 18px;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .slider-label span:last-child {
            color: var(--primary-color);
            font-weight: bold;
        }

        .slider {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: rgba(168, 212, 255, 0.1);
            border: 1px solid var(--border-color);
            appearance: none;
            cursor: pointer;
        }

        .slider::-webkit-slider-thumb {
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--primary-color);
            cursor: pointer;
            box-shadow: 0 0 10px var(--primary-color);
        }

        /* Activity Feed */
        .activity-panel {
            background: var(--background-medium);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .activity-tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
        }

        .activity-tab {
            flex: 1;
            padding: 14px;
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            color: var(--text-secondary);
            background: transparent;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        .activity-tab:hover {
            color: var(--unsc-blue);
            background: rgba(168, 212, 255, 0.05);
        }

        .activity-tab.active {
            color: var(--primary-color);
            border-bottom: 3px solid var(--primary-color);
            background: rgba(0, 217, 255, 0.05);
        }

        .activity-content {
            flex: 1;
            overflow-y: auto;
        }

        .activity-item {
            padding: 14px 18px;
            border-bottom: 1px solid rgba(168, 212, 255, 0.1);
        }

        .activity-item.signal {
            border-left: 3px solid var(--accent-green);
            background: rgba(0, 255, 65, 0.05);
        }

        .activity-item.recording {
            border-left: 3px solid var(--accent-red);
            background: rgba(255, 51, 51, 0.05);
        }

        .activity-time {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .activity-msg {
            font-size: 0.85rem;
            margin-top: 4px;
            color: var(--text-primary);
        }

        /* Recording Item */
        .recording-item {
            padding: 14px 18px;
            border-bottom: 1px solid rgba(168, 212, 255, 0.1);
        }

        .rec-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .rec-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--unsc-blue);
        }

        .rec-duration {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .rec-meta {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .rec-actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .rec-btn {
            font-family: 'Orbitron', sans-serif;
            padding: 8px 14px;
            font-size: 0.7rem;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s;
        }

        .rec-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
            box-shadow: 0 0 10px rgba(0, 217, 255, 0.2);
        }

        /* Audio Player */
        .audio-player {
            padding: 15px;
            background: rgba(10, 14, 23, 0.8);
            border-top: 1px solid var(--border-color);
        }

        .audio-player audio {
            width: 100%;
            height: 40px;
            border-radius: 5px;
        }

        /* Transcription */
        .transcription-box {
            padding: 18px;
            background: rgba(10, 14, 23, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-family: 'Overpass', sans-serif;
            font-size: 0.9rem;
            line-height: 1.7;
            max-height: 220px;
            overflow-y: auto;
            color: var(--text-secondary);
        }


        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--background-dark);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(168, 212, 255, 0.2);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-color);
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
            }

            .frequency-value {
                font-size: 2.5rem;
            }

            .status-leds {
                gap: 20px;
                flex-wrap: wrap;
            }

            .control-buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Scanner Display -->
    <div class="scanner-display">
        <div class="display-header">
            <div class="scanner-title">RTL-SDR Scanner // AT-D578UV</div>
            <div class="license-badge">GMRS: WSKW654</div>
        </div>

        <div class="frequency-display" onclick="showFreqInput()" style="cursor: pointer;" title="Click to enter frequency">
            <span class="frequency-value" id="freqDisplay">----.-----</span>
            <input type="text" id="freqInput" class="freq-input" style="display:none;" placeholder="462.5875" onkeypress="handleFreqInput(event)" onblur="hideFreqInput()">
            <span class="frequency-unit">MHz</span>
        </div>

        <div class="channel-info">
            <div class="channel-name" id="channelName">No Channel Selected</div>
            <div class="channel-mode" id="channelMode">--</div>
        </div>

        <div class="signal-meter-container">
            <div class="signal-meter" id="signalMeter"></div>
            <div class="signal-labels">
                <span>S1</span><span>S3</span><span>S5</span><span>S7</span><span>S9</span><span>+20</span><span>+40</span>
            </div>
        </div>

        <div class="status-leds">
            <div class="status-led">
                <div class="led" id="ledMonitor"></div>
                <span class="led-label">Monitor</span>
            </div>
            <div class="status-led">
                <div class="led" id="ledRecording"></div>
                <span class="led-label">Recording</span>
            </div>
            <div class="status-led">
                <div class="led" id="ledSignal"></div>
                <span class="led-label">Signal</span>
            </div>
        </div>
    </div>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Channel List -->
        <div class="channel-panel">
            <div class="panel-header">
                <span class="panel-title">Channels</span>
                <span id="channelCount">0</span>
            </div>
            <div class="channel-filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="encrypted">Encrypted</button>
                <button class="filter-btn" data-filter="analog">Analog</button>
                <button class="filter-btn" data-filter="digital">DMR</button>
                <button class="filter-btn" data-filter="fav">Favorites</button>
            </div>
            <div class="channel-list" id="channelList"></div>
        </div>

        <!-- Controls -->
        <div class="control-panel">
            <div class="control-group">
                <div class="control-group-title">Monitor Controls</div>
                <div class="control-buttons">
                    <button class="ctrl-btn" id="btnMonitor" onclick="toggleMonitor()">Monitor</button>
                    <button class="ctrl-btn record" id="btnRecord" onclick="toggleRecord()">Record</button>
                    <button class="ctrl-btn" id="btnScan" onclick="toggleScan()">Scan</button>
                </div>
            </div>

            <div class="control-group">
                <div class="control-group-title">Audio Settings</div>
                <div class="slider-control">
                    <div class="slider-label">
                        <span>Squelch</span>
                        <span id="squelchValue">0</span>
                    </div>
                    <input type="range" class="slider" id="squelchSlider" min="0" max="50" value="0" oninput="setSquelch(this.value)">
                </div>
                <div class="slider-control">
                    <div class="slider-label">
                        <span>Gain</span>
                        <span id="gainValue">40</span>
                    </div>
                    <input type="range" class="slider" id="gainSlider" min="0" max="50" value="40" oninput="setGain(this.value)">
                </div>
            </div>

        </div>

        <!-- Activity & Recordings -->
        <div class="activity-panel">
            <div class="activity-tabs">
                <button class="activity-tab active" data-tab="activity">Activity</button>
                <button class="activity-tab" data-tab="recordings">Recordings</button>
                <button class="activity-tab" data-tab="transcribe">Transcribe</button>
            </div>

            <div class="activity-content" id="activityContent">
                <!-- Dynamic content -->
            </div>

            <div class="audio-player" id="audioPlayer" style="display:none;">
                <audio id="audioElement" controls></audio>
            </div>
        </div>
    </div>

    <script>
        const socket = io();

        // State
        let channels = [];
        let currentChannel = null;
        let isMonitoring = false;
        let isRecording = false;
        let isScanning = false;
        let currentFilter = 'all';
        let currentTab = 'activity';
        let activityLog = [];
        let recordings = [];

        // Create signal meter bars
        const meterContainer = document.getElementById('signalMeter');
        for (let i = 0; i < 25; i++) {
            const bar = document.createElement('div');
            bar.className = 'signal-bar';
            bar.dataset.index = i;
            meterContainer.appendChild(bar);
        }

        // WebAudio setup for browser audio playback
        let audioContext = null;
        let audioQueue = [];
        let isPlaying = false;

        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)({
                    sampleRate: 24000
                });
                logActivity('Audio initialized');
            }
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }

        function playAudioChunk(base64Data) {
            if (!audioContext) return;

            try {
                // Decode base64 to binary
                const binaryString = atob(base64Data);
                const len = binaryString.length;
                const bytes = new Int16Array(len / 2);

                for (let i = 0; i < len; i += 2) {
                    bytes[i / 2] = (binaryString.charCodeAt(i) | (binaryString.charCodeAt(i + 1) << 8));
                }

                // Convert to float32 for WebAudio
                const floatData = new Float32Array(bytes.length);
                for (let i = 0; i < bytes.length; i++) {
                    floatData[i] = bytes[i] / 32768.0;
                }

                // Create audio buffer and play
                const buffer = audioContext.createBuffer(1, floatData.length, 24000);
                buffer.getChannelData(0).set(floatData);

                const source = audioContext.createBufferSource();
                source.buffer = buffer;
                source.connect(audioContext.destination);
                source.start();
            } catch (e) {
                console.error('Audio playback error:', e);
            }
        }

        // Socket events
        socket.on('connect', () => {
            logActivity('Connected to scanner server');
            loadChannels();
            loadRecordings();
        });

        socket.on('audio_data', (data) => {
            if (!audioContext) initAudio();
            playAudioChunk(data.data);
            // Flash signal LED when receiving audio
            document.getElementById('ledSignal').classList.add('on');
        });

        socket.on('status', updateStatus);
        socket.on('signal_detected', (data) => {
            document.getElementById('ledSignal').classList.add('on');
            setTimeout(() => document.getElementById('ledSignal').classList.remove('on'), 2000);
            logActivity(`Signal: ${data.name} (${data.frequency} MHz)`, 'signal');
        });

        socket.on('recording_complete', (data) => {
            logActivity(`Recording saved: ${data.filename}`, 'recording');
            loadRecordings();
        });

        // Load channels
        async function loadChannels() {
            try {
                const resp = await fetch('/api/channels');
                channels = await resp.json();
                document.getElementById('channelCount').textContent = channels.length;
                renderChannels();
            } catch (e) {
                logActivity('Failed to load channels', 'error');
            }
        }

        // Render channels
        function renderChannels() {
            let filtered = channels;
            if (currentFilter === 'encrypted') filtered = channels.filter(c => c.encrypted);
            else if (currentFilter === 'analog') filtered = channels.filter(c => c.type === 'Analog');
            else if (currentFilter === 'digital') filtered = channels.filter(c => c.type === 'Digital');

            const list = document.getElementById('channelList');
            list.innerHTML = filtered.map(ch => `
                <div class="channel-item ${ch.number === currentChannel ? 'active' : ''}" onclick="tuneChannel(${ch.number})">
                    <div class="ch-info">
                        <div class="ch-name">${ch.name}</div>
                        <div class="ch-freq">${ch.frequency.toFixed(5)} MHz</div>
                    </div>
                    <div class="ch-badges">
                        ${ch.encrypted ? '<span class="ch-badge enc">ENC</span>' : ''}
                        ${ch.type === 'Digital' ? '<span class="ch-badge dmr">DMR</span>' : ''}
                        ${ch.forbid_tx ? '<span class="ch-badge rx">RX</span>' : ''}
                    </div>
                </div>
            `).join('');
        }

        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderChannels();
            });
        });

        // Activity tabs
        document.querySelectorAll('.activity-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.activity-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentTab = tab.dataset.tab;
                renderActivityContent();
            });
        });

        // Tune to channel
        async function tuneChannel(num) {
            const resp = await fetch(`/api/tune/${num}`, { method: 'POST' });
            const data = await resp.json();
            if (data.success) {
                currentChannel = num;
                const ch = channels.find(c => c.number === num);
                if (ch) updateDisplay(ch);
                renderChannels();
                logActivity(`Tuned to: ${ch?.name || num}`);
            }
        }

        // Tune to a specific frequency
        async function tuneFrequency(freq) {
            // Find closest channel or tune directly
            const ch = channels.find(c => Math.abs(c.frequency - freq) < 0.001);
            if (ch) {
                tuneChannel(ch.number);
            } else {
                // Direct frequency tune via API
                const resp = await fetch('/api/tune/frequency', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({frequency: freq})
                });
                const data = await resp.json();
                if (data.success) {
                    // Initialize audio on user interaction (required by browsers)
                    initAudio();
                    document.getElementById('freqDisplay').textContent = freq.toFixed(5);
                    document.getElementById('channelName').textContent = 'Manual Tune';
                    document.getElementById('channelMode').textContent = 'Direct Frequency';
                    logActivity(`Tuned to ${freq} MHz - Audio streaming to browser`);
                    // Auto-start monitoring
                    isMonitoring = true;
                    document.getElementById('btnMonitor').classList.add('active');
                    document.getElementById('btnMonitor').textContent = 'Stop';
                    document.getElementById('ledMonitor').classList.add('on');
                } else {
                    logActivity(`Failed to tune: ${data.error}`);
                }
            }
        }

        // Show frequency input
        function showFreqInput(event) {
            if (event) event.stopPropagation();
            const display = document.getElementById('freqDisplay');
            const input = document.getElementById('freqInput');
            display.style.display = 'none';
            input.style.display = 'inline-block';
            input.value = display.textContent !== '----.-----' ? display.textContent : '';
            input.focus();
            input.select();
        }

        // Hide frequency input
        function hideFreqInput() {
            const display = document.getElementById('freqDisplay');
            const input = document.getElementById('freqInput');
            display.style.display = 'inline';
            input.style.display = 'none';
        }

        // Handle frequency input keypress
        function handleFreqInput(event) {
            if (event.key === 'Enter') {
                const freq = parseFloat(document.getElementById('freqInput').value);
                if (freq && freq > 1 && freq < 1000) {
                    tuneFrequency(freq);
                }
                hideFreqInput();
            } else if (event.key === 'Escape') {
                hideFreqInput();
            }
        }

        // Update display
        function updateDisplay(ch) {
            document.getElementById('freqDisplay').textContent = ch.frequency.toFixed(5);
            document.getElementById('channelName').textContent = ch.name;
            document.getElementById('channelMode').innerHTML =
                `${ch.type} ${ch.encrypted ? '| <span class="encrypted">ENCRYPTED</span>' : ''}`;
        }

        // Update status
        function updateStatus(status) {
            isMonitoring = status.scanning || status.monitoring;
            isRecording = status.recording;

            document.getElementById('ledMonitor').classList.toggle('on', isMonitoring);
            document.getElementById('ledRecording').classList.toggle('recording', isRecording);

            document.getElementById('btnMonitor').classList.toggle('active', isMonitoring);
            document.getElementById('btnMonitor').textContent = isMonitoring ? 'Stop' : 'Monitor';

            document.getElementById('btnRecord').classList.toggle('active', isRecording);
            document.getElementById('btnRecord').textContent = isRecording ? 'Stop Rec' : 'Record';
        }

        // Toggle functions
        async function toggleMonitor() {
            if (isMonitoring) {
                await fetch('/api/monitor/stop', { method: 'POST' });
                logActivity('Monitoring stopped');
            } else {
                if (!currentChannel) { logActivity('Select a channel first'); return; }
                const resp = await fetch(`/api/monitor/start/${currentChannel}`, { method: 'POST' });
                if ((await resp.json()).success) logActivity('Monitoring started');
            }
            isMonitoring = !isMonitoring;
            document.getElementById('btnMonitor').classList.toggle('active', isMonitoring);
            document.getElementById('ledMonitor').classList.toggle('on', isMonitoring);
        }

        async function toggleRecord() {
            if (isRecording) {
                await fetch('/api/record/stop', { method: 'POST' });
            } else {
                if (!currentChannel) { logActivity('Select a channel first'); return; }
                await fetch(`/api/record/start/${currentChannel}`, { method: 'POST' });
            }
            isRecording = !isRecording;
            document.getElementById('btnRecord').classList.toggle('active', isRecording);
            document.getElementById('ledRecording').classList.toggle('recording', isRecording);
        }

        async function toggleScan() {
            if (isScanning) {
                await fetch('/api/scan/stop', { method: 'POST' });
                logActivity('Scan stopped');
            } else {
                await fetch('/api/scan/start', { method: 'POST' });
                logActivity('Scanning...');
            }
            isScanning = !isScanning;
            document.getElementById('btnScan').classList.toggle('active', isScanning);
        }


        // Sliders
        function setSquelch(val) {
            document.getElementById('squelchValue').textContent = val;
        }

        function setGain(val) {
            document.getElementById('gainValue').textContent = val;
        }

        // Activity log
        function logActivity(msg, type = '') {
            const time = new Date().toLocaleTimeString();
            activityLog.unshift({ time, msg, type });
            if (activityLog.length > 100) activityLog.pop();
            if (currentTab === 'activity') renderActivityContent();
        }

        // Load recordings
        async function loadRecordings() {
            try {
                const resp = await fetch('/api/recordings');
                recordings = await resp.json();
                if (currentTab === 'recordings') renderActivityContent();
            } catch (e) {}
        }

        // Render activity content
        function renderActivityContent() {
            const content = document.getElementById('activityContent');

            if (currentTab === 'activity') {
                content.innerHTML = activityLog.map(a => `
                    <div class="activity-item ${a.type}">
                        <div class="activity-time">${a.time}</div>
                        <div class="activity-msg">${a.msg}</div>
                    </div>
                `).join('') || '<div class="activity-item">No activity yet</div>';
            } else if (currentTab === 'recordings') {
                content.innerHTML = recordings.map(r => `
                    <div class="recording-item">
                        <div class="rec-header">
                            <span class="rec-name">${r.filename}</span>
                        </div>
                        <div class="rec-meta">${new Date(r.created).toLocaleString()}</div>
                        <div class="rec-actions">
                            <button class="rec-btn" onclick="playRecording('${r.filename}')">Play</button>
                            <button class="rec-btn" onclick="transcribe('${r.filename}')">Transcribe</button>
                        </div>
                    </div>
                `).join('') || '<div class="activity-item">No recordings yet</div>';
            } else {
                content.innerHTML = '<div class="transcription-box" id="transcriptionBox">Select a recording to transcribe</div>';
            }
        }

        // Play recording
        function playRecording(filename) {
            const player = document.getElementById('audioPlayer');
            const audio = document.getElementById('audioElement');
            audio.src = `/api/recordings/${filename}`;
            player.style.display = 'block';
            audio.play();
        }

        // Transcribe
        async function transcribe(filename) {
            logActivity(`Transcribing: ${filename}...`);
            document.querySelectorAll('.activity-tab')[2].click(); // Switch to transcribe tab

            const content = document.getElementById('activityContent');
            content.innerHTML = '<div class="transcription-box">Transcribing... Please wait.</div>';

            try {
                const resp = await fetch(`/api/recordings/${filename}/transcribe`, { method: 'POST' });
                const data = await resp.json();
                content.innerHTML = `<div class="transcription-box">${data.transcription || data.error || 'No result'}</div>`;
            } catch (e) {
                content.innerHTML = '<div class="transcription-box">Transcription failed</div>';
            }
        }

        // Signal meter animation
        setInterval(() => {
            const bars = document.querySelectorAll('.signal-bar');
            const level = isMonitoring ? Math.random() * 25 : 0;

            bars.forEach((bar, i) => {
                const isActive = i < level;
                bar.classList.toggle('active', isActive);
                bar.classList.remove('low', 'mid', 'high');
                if (isActive) {
                    if (i < 10) bar.classList.add('low');
                    else if (i < 18) bar.classList.add('mid');
                    else bar.classList.add('high');
                }
            });
        }, 100);

        // Initial render
        renderActivityContent();
    </script>
</body>
</html>
